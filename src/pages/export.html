<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>trello-exporter-importer</title>
    <link rel="icon" href="../assets/icons/trello-exporter-importer.png" type="image/png" />
    <link rel="stylesheet" href="../styles/export.css" />
    <script src="%POWER_UP_SDK_URL%" defer></script>
    <script src="../app/export/main.ts" type="module"></script>
  </head>
  <body>
    <main class="export-shell">
      <header class="app-header">
        <div class="brand">
          <img
            src="../assets/icons/trello-exporter-importer.png"
            alt=""
            width="30"
            height="30"
          /><span>trello-exporter-importer</span>
        </div>
        <label class="language-picker"
          ><span class="sr-only" data-i18n="language"></span
          ><select id="language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select></label
        >
      </header>
      <nav class="tabs" role="tablist" aria-label="Workflow">
        <button
          id="export-tab"
          class="active-tab"
          role="tab"
          aria-selected="true"
          aria-controls="export-panel"
          data-i18n="exportTab"
        ></button>
        <button
          id="restore-tab"
          role="tab"
          aria-selected="false"
          aria-controls="restore-panel"
          data-i18n="exportRestore"
        ></button>
      </nav>
      <section id="export-panel" role="tabpanel" aria-labelledby="export-tab">
        <div class="hero">
          <h1 data-i18n="exportTitle"></h1>
          <p class="subtle" data-i18n="exportIntro"></p>
        </div>
        <section class="board-summary" aria-labelledby="board-name">
          <div class="board-symbol" aria-hidden="true">▥</div>
          <div>
            <h2 id="board-name">—</h2>
            <p id="board-counts" class="subtle"></p>
          </div>
          <button id="refresh" class="icon-button" data-i18n="exportRefresh" hidden></button>
        </section>
        <div id="standalone" class="notice" hidden>
          <p data-i18n="exportStandalone"></p>
        </div>
        <div id="connection" class="notice">
          <p id="connection-status" data-i18n="exportAuthRequired"></p>
          <button id="connect" data-i18n="exportConnect" disabled></button>
        </div>
        <fieldset id="formats">
          <legend data-i18n="exportFormat"></legend>
          <div class="format-grid">
            <label class="format-option"
              ><input type="radio" name="format" value="json" checked /><span class="format-top"
                ><span class="format-icon">JSON</span></span
              ><span class="subtle" data-i18n="exportJsonNote"></span
            ></label>
            <label class="format-option"
              ><input type="radio" name="format" value="md" /><span class="format-top"
                ><span class="format-icon">MD</span></span
              ><span class="subtle" data-i18n="exportMarkdownNote"></span></label
            ><label class="format-option"
              ><input type="radio" name="format" value="pdf" /><span class="format-top"
                ><span class="format-icon">PDF</span></span
              ><span class="subtle" data-i18n="exportPdfNote"></span></label
            ><label class="format-option"
              ><input type="radio" name="format" value="xlsx" /><span class="format-top"
                ><span class="format-icon">XLSX</span></span
              ><span class="subtle" data-i18n="exportXlsxNote"></span></label
            ><label class="format-option"
              ><input type="radio" name="format" value="csv" /><span class="format-top"
                ><span class="format-icon">CSV</span></span
              ><span class="subtle" data-i18n="exportCsvNote"></span
            ></label>
          </div>
        </fieldset>
        <section class="included" aria-labelledby="included-title">
          <h2 id="included-title" data-i18n="exportIncluded"></h2>
          <ul>
            <li data-i18n="exportStructure"></li>
            <li data-i18n="exportChecklists"></li>
            <li data-i18n="exportComments"></li>
            <li data-i18n="exportMetadata"></li>
            <li data-i18n="exportAttachmentLinks"></li>
          </ul>
        </section>
        <p class="subtle fine-print" data-i18n="exportLinksNotice"></p>
        <div id="operation" hidden>
          <p id="progress-label" role="status" aria-live="polite"></p>
          <progress id="progress" max="1"></progress
          ><button id="cancel" class="text-button" data-i18n="exportCancel"></button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <section id="result" class="result" aria-labelledby="result-title" hidden>
          <div class="success-mark" aria-hidden="true">✓</div>
          <h2 id="result-title"></h2>
          <p id="result-note" class="subtle"></p>
          <dl id="metrics" class="metrics"></dl>
          <p id="file-size" class="subtle"></p>
          <div id="warnings" class="warnings" hidden>
            <h3 data-i18n="exportWarnings"></h3>
            <ul id="warning-list"></ul>
          </div>
          <button id="save" class="primary"></button
          ><button id="report" class="text-button" data-i18n="exportReport"></button>
        </section>
        <div class="workflow-footer">
          <div class="workflow-actions">
            <button id="export" class="primary" data-i18n="exportAction" disabled></button>
          </div>
          <hr />
          <p class="privacy-note" data-i18n="exportPrivacy"></p>
          <p class="subtle fine-print" data-i18n="exportConsistency"></p>
          <details class="technical">
            <summary data-i18n="exportDetails"></summary>
            <p>
              <a
                href="%CONNECTED_APPS_URL%"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="manageAccess"
              ></a>
            </p>
          </details>
        </div>
      </section>
      <section id="restore-panel" role="tabpanel" aria-labelledby="restore-tab" hidden>
        <div class="hero">
          <h1 data-i18n="restoreTitle"></h1>
          <p class="subtle" data-i18n="restoreIntro"></p>
        </div>
        <label class="restore-file"
          ><span data-i18n="restoreFile"></span
          ><input id="restore-file" type="file" accept=".json,application/json"
        /></label>
        <p id="restore-status" role="status" aria-live="polite"></p>
        <section id="restore-preview" class="notice" hidden>
          <h2 id="restore-source"></h2>
          <p id="restore-counts"></p>
          <p id="restore-workspace"></p>
          <p id="restore-destination"></p>
          <button id="restore-analyze" data-i18n="restoreAnalyze"></button>
          <section id="restore-merge-plan" hidden>
            <h3 data-i18n="restoreMergeTitle"></h3>
            <p id="restore-merge-counts" role="status" aria-live="polite"></p>
            <p data-i18n="restoreMergeScope"></p>
            <div class="restore-actions">
              <button id="restore-keep-all" data-i18n="restoreKeepAll"></button>
              <button id="restore-use-all" data-i18n="restoreUseAll"></button>
            </div>
            <div id="restore-conflicts"></div>
          </section>
          <button id="restore-connect" data-i18n="restoreConnect" hidden></button>
          <p id="restore-previous" data-i18n="restorePrevious" hidden></p>
          <label class="restore-confirm"
            ><input id="restore-confirm" type="checkbox" /><span data-i18n="restoreConfirm"></span
          ></label>
        </section>
        <button id="restore-cancel" data-i18n="restoreCancel" hidden></button>
        <section id="restore-result" class="notice" hidden>
          <h2 id="restore-outcome"></h2>
          <a id="restore-target" target="_blank" rel="noopener noreferrer" hidden></a>
          <p data-i18n="restoreRetained"></p>
          <button id="restore-report" data-i18n="restoreReport"></button>
        </section>
        <div class="workflow-footer">
          <div class="workflow-actions">
            <button id="restore-start" class="primary" data-i18n="restoreAction" disabled></button
            ><button id="restore-resume" data-i18n="restoreResume" hidden></button>
          </div>
          <hr />
          <p class="privacy-note" data-i18n="restorePrivacy"></p>
          <p class="subtle fine-print" data-i18n="restoreConsistency"></p>
          <details class="technical">
            <summary data-i18n="exportDetails"></summary>
            <p data-i18n="restoreFileLimit"></p>
            <section id="restore-details" hidden>
              <h3 data-i18n="restoreLimitations"></h3>
              <ul id="restore-limitations"></ul>
            </section>
            <p data-i18n="restorePermission"></p>
            <p>
              <a
                href="%CONNECTED_APPS_URL%"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="manageAccess"
              ></a>
            </p>
          </details>
        </div>
      </section>
      <footer>
        <a
          id="privacy-link"
          href="./privacy.html"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="privacy"
        ></a
        ><a
          href="%SUPPORT_ISSUES_URL%"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="exportSupport"
        ></a
        ><span>Open source · MIT</span>
      </footer>
    </main>
  </body>
</html>
