name: Bug report
description: Report a reproducible bug in trello-exporter-importer
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve trello-exporter-importer

        Before opening an issue, search existing issues and make sure the bug has not already been reported

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact on users or developers
      placeholder: What happened and why it is a bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the minimal sequence of actions that causes the bug
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what actually happened
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the most relevant part of the project
      multiple: true
      options:
        - Trello Desktop integration
        - Trello web Power-Up
        - Authentication and permissions
        - Snapshot export
        - Restore
        - Local JSON files
        - Localization and resources
        - Build and CI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Specify the release version, package version, or commit hash
      placeholder: For example, v1.2.0 or 1a2b3c4

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Specify the OS, browser or Node.js version, and other relevant details
      placeholder: OS, Trello Desktop version, browser version, and Node.js version when relevant
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and additional materials
      description: Use synthetic board data only; remove tokens, signed URLs, private board links, and personal data
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I used synthetic data and removed tokens, signed URLs, private board links, and personal data
          required: true
